<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.B. Barrett Tractors — Sales App Demo</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --navy:#1B1A4E; --navy-dark:#12123A; --green:#5CB947; --green-dark:#3B8C2C;
    --blue:#4A47A3; --purple:#6B46C1; --amber:#e65100; --ink:#1a1a1a; --mid:#666; --soft:#8a8a8a;
    --line:#ececec; --bg:#f6f6f7;
  }
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink);margin:0;
       background:#14131c;background-image:radial-gradient(circle at 50% 0%,#23213a 0%,#0e0d14 62%);
       display:grid;place-items:center;overflow:hidden;-webkit-font-smoothing:antialiased}

  /* ── HANDSET ── */
  /* Fixed 390 x 844; fitPhone() picks a zoom that fits the window. zoom, not
     transform — it scales the layout box too, so nothing is left to scroll. */
  .phone{position:relative;width:390px;height:844px;flex:0 0 390px;zoom:var(--phone-scale,1);
         background:linear-gradient(160deg,#4a4e59,#2b2f37 26%,#1d2026);border-radius:56px;padding:11px;
         box-shadow:0 2px 0 rgba(255,255,255,.09) inset,0 44px 90px -22px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.5)}
  .phone::before,.phone::after{content:"";position:absolute;background:linear-gradient(90deg,#3a3e47,#22262d);border-radius:2px}
  .phone::before{left:-2.5px;top:186px;width:3px;height:62px;box-shadow:0 82px 0 #2b2f37,0 -76px 0 #2b2f37}
  .phone::after{right:-2.5px;top:214px;width:3px;height:96px}
  .screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#fff;
          display:flex;flex-direction:column}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:108px;height:31px;
          background:#000;border-radius:20px;z-index:60}
  .island::after{content:"";position:absolute;right:9px;top:9.5px;width:11px;height:11px;border-radius:50%;
                 background:#0d1b2a;box-shadow:0 0 0 1px rgba(255,255,255,.07) inset}
  .statusbar{height:46px;flex:0 0 46px;display:flex;align-items:center;padding:0 30px 0 34px;font-size:14px;
             font-weight:650;background:#fff;color:var(--ink);z-index:30;font-variant-numeric:tabular-nums}
  .statusbar .sp{flex:1}
  .statusbar .icons{display:flex;align-items:center;gap:6px}
  .statusbar.on-navy{background:var(--navy);color:#fff}
  .homebar{height:22px;flex:0 0 22px;background:#fff;display:grid;place-items:center;z-index:30}
  .homebar i{display:block;width:136px;height:5px;border-radius:5px;background:rgba(20,19,28,.26)}
  .app{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg)}
  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .body::-webkit-scrollbar{width:0}

  /* ── LOGO ── */
  .logo{display:inline-block;line-height:1;user-select:none}
  .logo .l1{font-size:17px;font-weight:900;letter-spacing:-.3px;color:var(--navy);white-space:nowrap}
  .logo .lbar{height:6px;background:var(--green);margin:3.5px 0;border-radius:1px}
  .logo .l2{font-size:10.5px;font-weight:900;letter-spacing:6.25px;color:var(--navy);text-align:center;padding-left:6.25px}
  .logo.rev .l1,.logo.rev .l2{color:#fff}
  .logo.big .l1{font-size:23px}
  .logo.big .lbar{height:8px;margin:5px 0}
  .logo.big .l2{font-size:14px;letter-spacing:8.6px;padding-left:8.6px}

  /* ── HEADER ── */
  .hero{background:var(--navy);padding:6px 18px 20px;color:#fff;flex-shrink:0}
  .hero-top{display:flex;justify-content:space-between;align-items:center}
  .bell{font-size:17px;cursor:pointer;position:relative;padding:4px}
  .bell .dot{position:absolute;top:0;right:0;min-width:15px;height:15px;background:#ffcf33;color:#5a3b00;border-radius:8px;font-size:9px;font-weight:800;
             display:flex;align-items:center;justify-content:center;padding:0 3px}
  .greet{font-size:12px;color:rgba(255,255,255,.75);margin-top:12px}
  .who{font-size:21px;font-weight:700;letter-spacing:-.3px}
  .weather{position:absolute;right:18px;bottom:16px;text-align:right;font-size:10px;color:rgba(255,255,255,.7)}

  .navbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
  .back{font-size:19px;color:var(--navy);cursor:pointer;line-height:1;padding:2px 4px;user-select:none}
  .navtitle{font-size:15px;font-weight:700;letter-spacing:-.2px}
  .navsub{font-size:10.5px;color:var(--soft);font-weight:500}
  .nav-action{margin-left:auto;font-size:12px;color:var(--green);font-weight:600;cursor:pointer}

  /* ── STATS ── */
  .stats{display:flex;gap:8px;padding:12px 12px 4px}
  .stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;cursor:pointer;transition:.12s}
  .stat:active{transform:scale(.97)}
  .stat .n{font-size:19px;font-weight:800;letter-spacing:-.6px}
  .stat .l{font-size:9.5px;color:var(--soft);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:1px}

  /* ── TILES ── */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 12px 12px;cursor:pointer;transition:.12s;position:relative}
  .tile:active{transform:scale(.97)}
  .tile .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:8px}
  .tile .t{font-size:13.5px;font-weight:700;letter-spacing:-.2px}
  .tile .s{font-size:10.5px;color:var(--soft);margin-top:1px}
  .tile-count{position:absolute;top:12px;right:12px;background:var(--navy);color:#fff;min-width:20px;height:20px;border-radius:10px;font-size:10.5px;
              font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

  /* ── BOTTOM NAV ── */
  .tabbar{background:#fff;border-top:1px solid var(--line);padding:8px 28px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .tabitem{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:19px;opacity:.5;transition:.12s;width:56px}
  .tabitem span{font-size:9.5px;font-weight:600;color:var(--soft)}
  .tabitem.on{opacity:1}
  .tabitem.on span{color:var(--navy)}
  .fab{width:46px;height:46px;background:var(--navy);border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;
       font-weight:300;cursor:pointer;box-shadow:0 2px 6px rgba(27,26,78,.28);transition:.15s;flex-shrink:0}
  .fab:active{transform:scale(.92)}

  /* ── LISTS ── */
  .pad{padding:12px}
  .searchrow{display:flex;gap:7px;padding:10px 12px 6px;background:var(--bg);flex-shrink:0}
  .srch{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit;color:var(--ink)}
  .srch:focus{outline:none;border-color:var(--navy)}
  .chips{display:flex;gap:6px;padding:4px 12px 10px;overflow-x:auto;flex-shrink:0;background:var(--bg)}
  .chips::-webkit-scrollbar{height:0}
  .chip{background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px 11px;font-size:11.5px;font-weight:600;color:var(--mid);
        cursor:pointer;white-space:nowrap;font-family:inherit}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .row{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;cursor:pointer;transition:.12s}
  .row:active{background:#fafafa}
  .row-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .row-title{font-size:14px;font-weight:700;letter-spacing:-.2px}
  .row-meta{font-size:11.5px;color:var(--soft);margin-top:2px;line-height:1.45}
  .row-actions{display:flex;gap:5px;margin-top:9px}
  .abtn{flex:1;padding:7px 6px;border:none;border-radius:8px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .abtn:active{filter:brightness(.9)}
  .abtn.ghost{background:#f2f2f3;color:var(--mid)}
  .empty{text-align:center;padding:44px 24px;color:var(--soft)}
  .empty .e{font-size:34px;margin-bottom:10px;opacity:.5}
  .empty .m{font-size:13px;line-height:1.6}

  /* ── BADGES ── */
  .bdg{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:10.5px;font-weight:700;white-space:nowrap;letter-spacing:.1px}
  .b-new{background:#eef2ff;color:#3730a3}
  .b-contacted{background:#e3f2fd;color:#0d47a1}
  .b-progress{background:#fff6e5;color:#b45309}
  .b-hold{background:#f3f4f6;color:#4b5563}
  .b-won{background:#EAF6E6;color:var(--green-dark)}
  .b-lost{background:#fee7e7;color:#b91c1c}
  .b-draft{background:#f3f4f6;color:#4b5563}
  .b-sent{background:#e3f2fd;color:#0d47a1}
  .b-accepted{background:#EAF6E6;color:var(--green-dark)}
  .b-converted{background:#f3e8ff;color:#6b21a8}
  .b-available{background:#EAF6E6;color:var(--green-dark)}
  .b-allocated{background:#fff6e5;color:#b45309}
  .b-sold{background:#f3f4f6;color:#4b5563}

  /* ── DETAIL ── */
  .card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}
  .card-label{font-size:9.5px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.7px}
  .card-value{font-size:16px;font-weight:700;margin-top:3px;letter-spacing:-.3px}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mid);padding:4px 0}
  .kv.total{font-size:15px;font-weight:800;color:var(--ink);border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
  .kv .neg{color:#b91c1c}
  .note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--green);border-radius:9px;padding:10px 11px;margin-bottom:8px}
  .note .txt{font-size:12.5px;line-height:1.55;color:#333}
  .note .by{font-size:10.5px;color:var(--soft);margin-top:5px}
  .banner{border-radius:10px;padding:10px 12px;font-size:11.5px;font-weight:600;margin-bottom:10px;line-height:1.5}
  .banner.green{background:#EEF8EA;border:1px solid #C5E5B9;color:#2F6B22}
  .banner.amber{background:#fff7e8;border:1px solid #f6dfae;color:#92400e}

  /* ── FORMS ── */
  .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .fg label{font-size:11.5px;font-weight:700;color:var(--mid)}
  .fg label .opt{font-weight:500;color:#b5b5b5}
  .inp{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;font-size:13.5px;font-family:inherit;color:var(--ink);width:100%}
  .inp:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,26,78,.10)}
  select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23999'/></svg>");
             background-repeat:no-repeat;background-position:right 12px center}
  textarea.inp{resize:none;line-height:1.5}
  .inp.err{border-color:#e11d48;background:#fff5f6}
  .errmsg{font-size:11px;color:#e11d48;font-weight:600}
  .fg-row{display:flex;gap:9px}
  .fg-row>*{flex:1}
  .seg{display:flex;gap:5px}
  .seg button{flex:1;padding:8px 4px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:11.5px;font-weight:700;color:var(--mid);
              cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .check{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:13px;
         font-weight:600;cursor:pointer;margin-bottom:12px}
  .box{width:20px;height:20px;border-radius:6px;border:1.5px solid #d4d4d4;display:flex;align-items:center;justify-content:center;font-size:12px;
       color:#fff;flex-shrink:0;transition:.12s}
  .box.on{background:var(--green);border-color:var(--green)}
  .calcbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}

  /* ── BUTTONS ── */
  .footerbar{padding:10px 12px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;flex-shrink:0}
  .btn{flex:1;padding:13px 12px;border:none;border-radius:12px;color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
       text-align:center;transition:.12s;letter-spacing:-.1px}
  .btn:active{transform:scale(.98);filter:brightness(.93)}
  .btn.navy{background:var(--navy)} .btn.green{background:var(--green)} .btn.blue{background:var(--blue)}
  .btn.purple{background:var(--purple)} .btn.amber{background:var(--amber)} .btn.dark{background:#3a3a3a}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--mid)}
  .btn.full{width:100%}

  /* ── SHEET / MODAL / TOAST ── */
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;animation:fade .18s ease}
  .overlay.center{align-items:center;justify-content:center;padding:22px}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:12px 14px 16px;animation:up .22s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .grab{width:36px;height:4px;background:#e2e2e2;border-radius:3px;margin:0 auto 14px}
  .sheet h3{font-size:16px;font-weight:800;text-align:center;margin-bottom:14px;letter-spacing:-.3px}
  .sheet-btn{width:100%;padding:14px;border:none;border-radius:13px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
             text-align:left;margin-bottom:8px;position:relative;display:flex;align-items:center;gap:10px}
  .dialog{background:#fff;border-radius:18px;width:100%;overflow:hidden;animation:pop .2s cubic-bezier(.2,.9,.3,1)}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .dialog-body{padding:20px 18px 16px;text-align:center}
  .dialog .dico{font-size:36px;margin-bottom:10px}
  .dialog h3{font-size:16px;font-weight:800;margin-bottom:6px}
  .dialog p{font-size:12.5px;color:var(--mid);line-height:1.6}
  .dialog-foot{display:flex;gap:8px;padding:0 14px 14px}
  .toast{position:absolute;left:14px;right:14px;bottom:88px;background:#1f1f22;color:#fff;border-radius:13px;padding:12px 14px;font-size:12.5px;
         font-weight:600;z-index:70;display:flex;align-items:center;gap:9px;box-shadow:0 10px 26px rgba(0,0,0,.35);animation:up .2s ease;line-height:1.4}
  .toast.good{background:#0f6b56} .toast.warn{background:#7c2d12}

  .starrow{display:flex;gap:5px}
  .star{flex:1;padding:8px 2px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:12px;cursor:pointer;font-family:inherit;color:#c9c9c9}
  .star.on{background:#fff8e6;border-color:#f0c04a;color:#e08c00;font-weight:700}
  .agebar{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0}
  .stockrow{display:flex;gap:10px}

  .listinfo{font-size:11px;color:var(--soft);padding:0 12px 8px;font-weight:600}
  .acc-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:8px;
            font-size:13.5px;font-weight:600;cursor:pointer}
  .acc-item .ai{font-size:17px;width:24px;text-align:center}
  .acc-item .av{margin-left:auto;font-size:12px;color:var(--soft);font-weight:600}
  .switch{margin-left:auto;width:42px;height:25px;background:#e2e2e4;border-radius:13px;position:relative;transition:.16s;flex-shrink:0}
  .switch.on{background:var(--green)}
  .switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.16s;
                 box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch.on::after{transform:translateX(17px)}

  @media (max-width:520px) and (pointer:coarse){
    body{display:block;background:#fff;background-image:none}
    .phone{width:100vw;height:100vh;height:100dvh;flex:none;border-radius:0;padding:0;
           box-shadow:none;background:none;zoom:1 !important}
    .phone::before,.phone::after{display:none}
    .screen{border-radius:0}
    .island,.statusbar,.homebar{display:none}
  }
</style>
</head>

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '£' + Math.round(n||0).toLocaleString('en-GB');
const BADGE_CLS = {'New':'b-new','Contacted':'b-contacted','In Progress':'b-progress','On Hold':'b-hold','Closed/Won':'b-won','Lost Sale':'b-lost',
  'Draft':'b-draft','Sent':'b-sent','Accepted':'b-accepted','Converted':'b-converted','Confirmed':'b-accepted',
  'Available':'b-available','Allocated':'b-allocated','Sold':'b-sold'};
const badge = s => '<span class="bdg '+(BADGE_CLS[s]||'b-hold')+'">'+esc(s)+'</span>';
const pill = (txt,cls) => '<span class="bdg '+cls+'">'+esc(txt)+'</span>';
const stars = n => '★'.repeat(n)+'☆'.repeat(4-n);
function dstr(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(2); }
function parseDate(s){ const m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec((s||'').trim()); if(!m) return null;
  let y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[2]-1,+m[1]); }
function daysAway(s){ const d=parseDate(s); if(!d) return null; return Math.round((d-today)/86400000); }
function quoteTotal(q){ const net = (q.price||0)*(q.qty||1) - (q.tradeIn||0); const vat = q.vat ? net*0.2 : 0; return {net, vat, gross:net+vat}; }
function ageColor(m){ return m<=3 ? '#43a047' : m<=8 ? '#fb8c00' : '#e53935'; }

function failValidation(f, err){ f._err = err; render();
  const b = document.querySelector('.body'); if(b) b.scrollTop = 0;
  toast('Check the highlighted fields','warn'); }
function toast(msg, kind){ S.toast = {msg, kind:kind||''}; render(); clearTimeout(window._tt); window._tt = setTimeout(()=>{ S.toast=null; render(); }, 2600); }

function go(screen, params){ S.stack.push({screen:S.screen, params:S.params, q:S.q, filter:S.filter, filter2:S.filter2});
  S.screen = screen; S.params = params||{}; S.q=''; S.filter='All'; S.filter2='All'; S.sheet=false; S.dialog=null;
  const b=document.querySelector('.body'); if(b) b.scrollTop=0; render(); }
function back(){ const p = S.stack.pop(); if(!p){ S.screen='home'; S.params={}; } else { S.screen=p.screen; S.params=p.params; S.q=p.q; S.filter=p.filter; S.filter2=p.filter2; }
  S.sheet=false; S.dialog=null; render(); }
function jump(screen, params){ S.stack=[]; S.screen=screen; S.params=params||{}; S.q=''; S.filter='All'; S.filter2='All'; S.sheet=false; S.dialog=null; render(); }

function setQ(v){ S.q=v; renderBodyOnly(); }
function setFilter(v){ S.filter=v; render(); }
function setFilter2(v){ S.filter2=v; render(); }
function fset(k,v){ S.form[k]=v; if(S.form._err) delete S.form._err[k]; }
function ftoggle(k){ S.form[k]=!S.form[k]; render(); }
function fsetR(k,v){ S.form[k]=v; render(); }

function dueBits(){
  const items=[];
  db.leads.forEach(l=>{ const d=daysAway(l.followUp); if(d!==null && d<=10 && l.status!=='Closed/Won' && l.status!=='Lost Sale')
    items.push({kind:'lead', id:l.id, who:l.name, what:'Follow-up call', when:l.followUp, days:d}); });
  db.visits.forEach(v=>{ const d=daysAway(v.revisit); if(d!==null && d<=10)
    items.push({kind:'visit', id:v.id, who:v.customer, what:'Revisit due', when:v.revisit, days:d}); });
  return items.sort((a,b)=>a.days-b.days);
}

function fsetLive(k,v){ S.form[k]=v; const b=document.querySelector('.body'); const sc=b?b.scrollTop:0; renderBodyOnly(sc, true); }
function pickStock(id){ const s = db.stock.find(x=>x.id===id);
  S.form.stockRef = id;
  if(s){ S.form.model=s.model; S.form.brand=s.brand; S.form.price=String(s.price); }
  render(); if(s) toast('Pulled '+s.model+' from stock'); }

function saveQuote(){
  const f = S.form, err = {};
  if(!f.customer.trim()) err.customer='Customer name is required';
  if(!f.model.trim()) err.model='Tell us what you are quoting';
  if(!(parseFloat(f.price)>0)) err.price='Enter a price';
  if(Object.keys(err).length){ failValidation(f, err); return; }
  const rec = { customer:f.customer.trim(), model:f.model.trim(), brand:f.brand.trim()||'—', spec:f.spec.trim(),
    price:parseFloat(f.price), qty:parseInt(f.qty)||1, tradeIn:parseFloat(f.tradeIn)||0, vat:!!f.vat, stockRef:f.stockRef||'' };
  let id;
  if(f.id){ const x = db.quotes.find(q=>q.id===f.id); Object.assign(x, rec); id=x.id; }
  else { id = db.seq.quote++; db.quotes.unshift(Object.assign({ id, status:'Draft', rep:ME.full, date:dstr(today) }, rec)); }
  save(); S.stack = S.stack.filter(s=>s.screen!=='quote-form'); jump('quote',{id});
  toast(f.id?'Quote #'+id+' updated':'Quote #'+id+' created','good');
}

function saveOrder(){
  const f = S.form, err = {};
  if(!f.customer.trim()) err.customer='Customer is required';
  if(!f.equipment.trim()) err.equipment='Equipment is required';
  if(!(parseFloat(f.total)>0)) err.total='Enter the order total';
  if(Object.keys(err).length){ failValidation(f, err); return; }
  const id = 'SO-0'+(db.seq.order++);
  db.orders.unshift({ id, quoteId:f.quoteId, customer:f.customer.trim(), equipment:f.equipment.trim(), stockRef:f.stockRef,
    warranty:f.warranty.trim()||'—', total:parseFloat(f.total), deposit:!!f.deposit, delivery:f.delivery.trim(),
    date:dstr(today), rep:ME.full, status:'Confirmed' });
  if(f.quoteId){ const q = db.quotes.find(x=>x.id===f.quoteId); if(q) q.status='Converted'; }
  if(f.stockRef){ const s = db.stock.find(x=>x.id===f.stockRef); if(s) s.status='Allocated'; }
  save(); S.stack = S.stack.filter(s=>s.screen!=='order-form'); jump('order',{id});
  toast('Sales order '+id+' confirmed','good');
}

function saveLead(){
  const f = S.form, err = {};
  if(!f.name.trim()) err.name='Customer name is required';
  if(!f.machine.trim()) err.machine='What are they interested in?';
  if(f.followUp.trim() && !parseDate(f.followUp)) err.followUp='Use DD/MM/YYYY';
  if(Object.keys(err).length){ failValidation(f, err); return; }
  let id;
  if(f.id){ const l = db.leads.find(x=>x.id===f.id);
    Object.assign(l, {name:f.name.trim(), phone:f.phone.trim(), machine:f.machine.trim(), status:f.status, priority:f.priority, followUp:f.followUp.trim()});
    id = l.id; }
  else { id = db.seq.lead++;
    db.leads.unshift({ id, name:f.name.trim(), phone:f.phone.trim()||'—', machine:f.machine.trim(), status:f.status,
      priority:f.priority, followUp:f.followUp.trim(), rep:ME.full,
      notes: f.note.trim()?[{t:f.note.trim(), d:dstr(today), by:ME.full}]:[{t:'Lead created.', d:dstr(today), by:ME.full}] }); }
  save(); S.stack = S.stack.filter(s=>s.screen!=='lead-form'); jump('lead',{id});
  toast(f.id?'Lead updated':'Lead saved','good');
}

    + '<div class="fg"><label>Revisit date <span class="opt">optional</span></label><input class="inp '+(e.revisit?'err':'')+'" value="'+esc(f.revisit)+'" placeholder="DD / MM / YYYY" oninput="fset(\'revisit\',this.value)">'
    + (e.revisit?'<div class="errmsg">'+e.revisit+'</div>':'<div style="font-size:11px;color:var(--soft)">🔔 Reminder notification on this date</div>')+'</div>'
    + '</div>';
  return { html: navbar(f.id?'Edit Site Visit':'Log Site Visit', f.id?f.customer:dstr(today))
    + '<div class="body">'+body+'</div>'
    + '<div class="footerbar"><button class="btn ghost" onclick="back()">Cancel</button>'
    + '<button class="btn purple" style="flex:2" onclick="saveVisit()">💾 Save visit</button></div>' };
}
function saveVisit(){
  const f = S.form, err = {};
  if(!f.customer.trim()) err.customer='Customer is required';
  if(!f.purpose.trim()) err.purpose='Add a line or two about the visit';
  if(f.revisit.trim() && !parseDate(f.revisit)) err.revisit='Use DD/MM/YYYY';
  if(Object.keys(err).length){ failValidation(f, err); return; }
  let id;
  if(f.id){ const v = db.visits.find(x=>x.id===f.id); Object.assign(v,{customer:f.customer.trim(), purpose:f.purpose.trim(), revisit:f.revisit.trim()}); id=v.id; }
  else { id = db.seq.visit++; db.visits.unshift({ id, customer:f.customer.trim(), purpose:f.purpose.trim(), revisit:f.revisit.trim(), date:dstr(today), rep:ME.full }); }
  save(); S.stack = S.stack.filter(s=>s.screen!=='visit-form'); jump('visit',{id});
  toast(f.id?'Site visit updated':'Site visit saved','good');
}

/* ═══════════════ STOCK ═══════════════ */

  if(S.filter!=='All') list = list.filter(s=>s.brand===S.filter);
  if(S.filter2!=='All') list = list.filter(s=>s.cond===S.filter2);
  const brands = ['All'].concat(Array.from(new Set(db.stock.map(s=>s.brand))));
  const rows = list.length ? list.map(s=>
    '<div class="row" onclick="go(\'stockitem\',{id:\''+s.id+'\'})"><div class="stockrow">'
    + '<div class="agebar" style="background:'+ageColor(s.age)+'"></div><div style="flex:1">'
    + '<div class="row-head"><div><div class="row-title">'+esc(s.model)+'</div>'
    + '<div class="row-meta">'+esc(s.cond)+' · '+esc(s.cat)+' · '+esc(s.depot)+'<br>'+money(s.price)+' · '
    + '<span style="color:'+ageColor(s.age)+';font-weight:700">'+s.age+' mth in stock</span></div></div>'+badge(s.status)+'</div>'
    + '<div class="row-actions">'
    + '<button class="abtn" style="background:var(--green);flex:2" onclick="event.stopPropagation();quoteFromStock(\''+s.id+'\')">📄 Quote</button>'
    + (s.status==='Available'
        ? '<button class="abtn" style="background:var(--amber);flex:2" onclick="event.stopPropagation();allocate(\''+s.id+'\')">📌 Allocate</button>'
        : '<button class="abtn ghost" style="flex:2" onclick="event.stopPropagation();release(\''+s.id+'\')">↩ Release</button>')
    + '</div></div></div></div>').join('') : empty('📦','Nothing in stock matches those filters.');
  return { html: navbar('Stock', db.stock.filter(s=>s.status==='Available').length+' available')
    + search('Search model, brand or ref')
    + chips(brands, S.filter, 'setFilter')
    + chips(['All','New','Used'], S.filter2, 'setFilter2')

    + '<div class="body"><div class="pad" style="padding-top:0">'+rows+'</div></div>' + tabbar() };

function scr_stockitem(){

    + '<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start">'
    + '<div><div class="card-label">Machine</div><div class="card-value">'+esc(s.model)+'</div></div>'+badge(s.status)+'</div>'
    + '<div style="font-size:11.5px;color:var(--soft);margin-top:6px">'+esc(s.id)+' · '+esc(s.brand)+' · '+esc(s.cat)+'</div></div>'
    + '<div class="card"><div class="kv"><span>Condition</span><span>'+esc(s.cond)+'</span></div>'
    + '<div class="kv"><span>Depot</span><span>'+esc(s.depot)+'</span></div>'
    + '<div class="kv"><span>Time in stock</span><span style="color:'+ageColor(s.age)+';font-weight:700">'+s.age+' months</span></div>'
    + '<div class="kv total"><span>List price</span><span>'+money(s.price)+'</span></div></div>'
    + '<button class="btn green full" style="margin-bottom:9px" onclick="quoteFromStock(\''+s.id+'\')">📄 Quote this machine</button>'
    + (s.status==='Available'
        ? '<button class="btn amber full" onclick="allocate(\''+s.id+'\')">📌 Allocate to a customer</button>'
        : '<button class="btn ghost full" onclick="release(\''+s.id+'\')">↩ Release allocation</button>')
    + '</div>';

}
function quoteFromStock(id){ const s = db.stock.find(x=>x.id===id);
  newQuote({ customer:'', model:s.model, brand:s.brand, price:String(s.price), stockRef:s.id, spec:s.cond+' · '+s.cat+' · held at '+s.depot }); }
function allocate(id){ const s = db.stock.find(x=>x.id===id); s.status='Allocated'; save(); render(); toast(s.model+' allocated','good'); }
function release(id){ const s = db.stock.find(x=>x.id===id); s.status='Available'; save(); render(); toast(s.model+' released back to stock'); }

function toggleSetting(k){ db.settings[k] = !db.settings[k]; save(); render(); toast(k==='notifications'?('Reminders '+(db.settings[k]?'on':'off')):('Offline mode '+(db.settings[k]?'on':'off'))); }

/* ═══════════════ ROUTER ═══════════════ */
const SCREENS = {
  'home':scr_home, 'notifications':scr_notifications,
  'quotes':scr_quotes, 'quote':scr_quote, 'quote-form':scr_quote_form,
  'orders':scr_orders, 'order':scr_order, 'order-form':scr_order_form,
  'leads':scr_leads, 'lead':scr_lead, 'lead-form':scr_lead_form,
  'visits':scr_visits, 'visit':scr_visit, 'visit-form':scr_visit_form,
  'stock':scr_stock, 'stockitem':scr_stockitem, 'account':scr_account
};
const MAP = [
  ['Home', [['home','🏠 Home'],['notifications','🔔 Notifications'],['account','👤 Account']]],
  ['Quotes', [['quotes','📄 Quotes list'],['quote-form','✏️ New quote']]],
  ['Sales Orders', [['orders','🛒 Orders list'],['order-form','✏️ New order']]],
  ['Sales Leads', [['leads','👥 Leads list'],['lead-form','✏️ New lead']]],
  ['Site Visits', [['visits','📍 Visits list'],['visit-form','✏️ Log visit']]],
  ['Stock', [['stock','📦 Stock list']]]
];
function mapGo(s){
  if(s==='quote-form') return newQuote();
  if(s==='lead-form') return newLead();
  if(s==='visit-form') return newVisit();
  if(s==='order-form') return newOrder();
  jump(s);
}
function renderMap(){
  const host = document.getElementById('screenmap'); if(!host) return;
  host.innerHTML = MAP.map(g =>
    '<div class="grp">'+g[0]+'</div>' + g[1].map(b =>
      '<button class="mapbtn '+(S.screen===b[0]?'on':'')+'" onclick="mapGo(\''+b[0]+'\')">'+b[1]+'</button>').join('')
  ).join('');
}

let _focus = null;
function captureFocus(){
  const el = document.activeElement;
  if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA')) _focus = { id:el.id, cls:el.className, val:el.value, pos:el.selectionStart, ph:el.placeholder };
  else _focus = null;
}
function restoreFocus(){
  if(!_focus) return;
  const sel = _focus.id ? document.getElementById(_focus.id)
            : Array.from(document.querySelectorAll('input,textarea')).find(x=>x.placeholder===_focus.ph);
  if(sel){ sel.focus(); try{ sel.setSelectionRange(_focus.pos,_focus.pos); }catch(e){} }
  _focus = null;
}

function render(){
  const fn = SCREENS[S.screen] || scr_home;
  const out = fn();
  const app = document.getElementById('app');
  const prev = app.querySelector('.body');
  const keepScroll = prev && app.dataset.screen===S.screen+JSON.stringify(S.params) ? prev.scrollTop : 0;
  captureFocus();
  document.getElementById('statusbar').className = 'statusbar' + (out.navy?' on-navy':'');
  app.innerHTML = out.html + sheetHTML() + dialogHTML() + toastHTML();
  app.dataset.screen = S.screen + JSON.stringify(S.params);
  const b = app.querySelector('.body'); if(b) b.scrollTop = keepScroll;
  restoreFocus();
  renderMap();
}
function renderBodyOnly(scroll, silent){
  const fn = SCREENS[S.screen] || scr_home;
  const out = fn();
  const app = document.getElementById('app');
  const cur = app.querySelector('.body'); const sc = scroll!=null ? scroll : (cur?cur.scrollTop:0);
  captureFocus();
  app.innerHTML = out.html + sheetHTML() + dialogHTML() + toastHTML();
  const b = app.querySelector('.body'); if(b) b.scrollTop = sc;
  restoreFocus();
  renderMap();
}

/* The handset is a fixed 390 x 844 and the window rarely is: pick the zoom that fits. */
const PHONE_W = 390, PHONE_H = 844;
function fitPhone(){
  if(window.matchMedia('(max-width:520px) and (pointer:coarse)').matches){
    document.documentElement.style.setProperty('--phone-scale','1'); return;
  }
  const s = Math.max(.35, Math.min(1, (innerWidth-28)/PHONE_W, (innerHeight-28)/PHONE_H));
  document.documentElement.style.setProperty('--phone-scale', String(s));
}
fitPhone();
addEventListener('resize', fitPhone);

render();
</script>
